    allow_from: []
    # 是否关闭私信功能
    block_dm: false
    enabled: false
  slack:
    # Slack Bot via Socket Mode. Tokens are created in the Slack app settings.
    #
    # One workspace: write the pair here and leave workspaces below empty. This
    # is the shape every Slack config had before workspaces existed and it is
    # not deprecated -- it is read as a single workspace and produces the one
    # connection it always produced.
    bot_token:
    app_token:
    # Several workspaces in one process: one entry per Slack app, each holding
    # the token pair that app was issued. Written, this list is what is used and
    # the bot_token/app_token pair above is ignored (with a warning naming it,
    # so it can be deleted rather than left looking effective).
    #
    # One Slack app per workspace, installed by hand, tokens pasted here. There
    # is no OAuth flow, no app distribution and no token store: the route this
    # supports is the one an operator can complete in the Slack app settings.
    #
    # Each entry becomes its own connection and its own channel instance, which
    # is not an implementation detail -- a Socket Mode handler serves exactly
    # one install and blocks for its lifetime, so a second workspace cannot be a
    # second handler on the first. It is also what makes the per-workspace state
    # correct without anyone maintaining it: the bot's own user id, the bot id,
    # the workspace host an attachment may be downloaded from, and every
    # per-conversation record belong to one instance each.
    #
    # A block holds credentials and nothing else. The four keys below are all
    # one may set:
    #   bot_token          - xoxb-…, the app's Web API token
    #   app_token          - xapp-…, with connections:write, opens the socket
    #   enabled            - omit and the block is on when both tokens are
    #                        present, which is the rule the single mapping has
    #                        always been read by; write false to keep the
    #                        credentials and stop connecting
    #   default_channel_id - the conversation a producer with no request
    #                        metadata falls back to. Per workspace because a
    #                        channel id names a room in one workspace and
    #                        nothing at all in another. Omitted, the
    #                        connector-wide default_channel_id below is used.
    # Any other key written inside a block is ignored, and says so in the log.
    #
    # Every other channels.slack key -- the emoji, the statuses, streaming, the
    # history policy, the block-kit settings, group_chat_mode -- is one
    # connector-wide value shared by every workspace. To give one workspace, one
    # conversation or one person different behaviour, write a scope for it in
    # the top-level scopes list at the end of this file. Two ways to set one
    # thing is how a deployment ends up running the value nobody wrote.
    #
    # workspaces:
    #   - bot_token: xoxb-…
    #     app_token: xapp-…
    #     default_channel_id: C0ACME
    #   - bot_token: xoxb-…
    #     app_token: xapp-…
    #     default_channel_id: C0OTHER
    #     enabled: false
    workspaces: []
    # Slack user IDs allowed to use the bot. Empty allows all users.
    allow_from: []
    # Channel IDs allowed to mention the bot. Empty allows all channels.
    allowed_channel_ids: []
    # Whose app-posted messages this connector reads. Everything an app touches
    # carries a bot_id -- including a message a *person* posted through an app
    # holding a user token, where the user field is that person and is correct
    # and the bot_id is only the app that issued the token. One word for the
    # whole connector, widening downwards:
    #   none   - no app message is read (default). Anything carrying a bot_id is
    #            dropped before a trigger is even looked for, which is why
    #            nothing a workflow, an integration or another bot posts can
    #            reach the agent.
    #   listed - only apps whose app_id is written in app_messages_from below.
    #   all    - every app, whatever it is and whoever installed it.
    # Shipped as none, so an upgrade into this key changes no behaviour.
    #
    # Two things no word here can readmit. This bot's own messages are refused
    # under all three, matched on the bot id as well as the user id, and an app
    # message is refused outright while neither of those is known -- under "all"
    # that refusal is the only thing between the connector and answering itself,
    # so it does not depend on a startup call having succeeded. And a message
    # with no user field is refused whatever word is set: an app posting as
    # itself names nobody to attribute it to, and every identity rule below this
    # point -- allow_from, the scopes' user axis, the session key -- needs a
    # sender. An app posting through its own bot user does carry one, and that
    # is the shape a word here admits; an incoming webhook carries subtype:
    # bot_message and no user at all.
    #
    # Adding an app is a trust decision and not a convenience. Every message it
    # posts, anywhere this bot can see it, becomes agent-visible from then on
    # and is handled as the message of whoever the user field names, with that
    # person's allow_from entry, their scopes and their session. Nothing is
    # reattributed, because nothing needs to be: the user field already names
    # the right person.
    #
    # One word for the connector rather than a scope key, because this decides
    # whether a message is seen at all -- nearer a security boundary than a
    # preference, and the security-adjacent sections below are deliberately not
    # freely addressable either. A per-conversation version can be added later
    # as a scope key without these three words changing.
    app_messages: none
    # The apps "app_messages: listed" admits, by app_id.
    #
    # Read under that word and no other. Entries left here while app_messages is
    # none admit nothing, and under all they narrow nothing -- all means all,
    # and there is deliberately no deny list to pair with it. Nothing is emptied
    # when the word moves, so an operator can drop to none and come back without
    # retyping what they had decided.
    #
    # Write app ids (A…), never bot ids (B…). An app_id is global to the app and
    # is the same string in every workspace it is installed in; a bot_id and the
    # bot user id are created per installation, so reinstalling the app changes
    # them and a list written against a bot_id quietly stops matching. Find an
    # app's id in the URL of its settings page (api.slack.com/apps/A0123456789),
    # or read it off a message the app posted: conversations.history returns
    # app_id beside bot_id on every one of them. An id naming no app is not an
    # error -- it simply never matches.
    app_messages_from: []
    # How far the Slack history tool may read. One word for the whole
    # connector, widening downwards:
    #   disabled - no history tool at all (default)
    #   origin   - the conversation the request arrived in, and only that one.
    #              The tool declares no target argument, so nothing the model
    #              writes can choose a conversation, and it costs no membership
    #              lookup at all.
    #   members  - a request may name another conversation T. Every named one is
    #              checked, at read time, against everybody in the conversation
    #              the request arrived in: they must all be in T as well. Read it
    #              as "nobody here learns anything they could not already learn",
    #              because the answer is posted here in front of all of them. A
    #              direct message is the same rule in its smallest form -- the
    #              one person and the bot must both be in T.
    #   visible  - as members, except that for a target which is a public
    #              channel the question asked about each person here is
    #              whether they could read T themselves, not whether they are
    #              in it. Joining a public channel is self-serve for a full
    #              member of the workspace, so being absent from one is not
    #              being unable to read it. A guest cannot join, and neither
    #              can anybody Slack does not report as a full member of this
    #              workspace -- an application, because what an app's token may
    #              read is decided by scopes nothing here can see, and somebody
    #              reaching a shared channel from another organisation. It
    #              costs one users.info lookup per person who is missing,
    #              bounded by history_max_user_lookups below.
    #   open     - as members, except that a target which is a public channel
    #              skips the check entirely, guests included. Public
    #              membership is self-serve, so its content was already
    #              reachable by anyone who cared to join. The cheap word: it
    #              reads no member list and no directory entry at all.
    #              A public *source* earns nothing under any word: somebody can
    #              join it later and read the answer out of the scrollback.
    # A refusal names the members that blocked it, so it can be acted on --
    # except under visible, where the set has been narrowed by what each person
    # is and naming it would publish who is a guest. There it reports how many.
    # The narrowest word is "disabled" and not "off" because YAML 1.1 -- which
    # is what this file is read with -- resolves a bare off to the boolean
    # false. Written that way it would be the one word of the five an operator
    # could not write without quoting it.
    history: disabled
    # Conversations that may never be read as a target, whoever asks. Checked
    # before any membership is fetched, so a conversation excluded here is never
    # enumerated in order to be refused. It does not stop a conversation being
    # read as the one the request arrived in: reading a room to the room itself
    # discloses to exactly the people already there.
    history_never_read: []
    # Members whose presence does not block the check above. For workspace-wide
    # integrations that sit in every channel and would otherwise refuse every
    # read. Ids rather than an exclude_bots switch, so that what was decided can
    # be read back and audited; a switch would silently cover every integration
    # added afterwards. This is also the whole of what an application gets
    # under history: visible -- that word relaxes a public target for anybody
    # who could have reached it alone, and for an application Slack reports
    # nothing that would establish it, so an app goes on blocking until
    # somebody names it here.
    # The person asking is never exempted by this list -- they are added back
    # after it is applied, because their own membership of T is the one thing
    # that is definitionally required.
    history_exempt_members: []
    # How far the Slack posting tools may write. One word for the whole
    # connector, widening downwards:
    #   disabled - no posting tool at all (default)
    #   origin   - the conversation the request arrived in, and only that one.
    #              The three cards declare no chat_id, so nothing the model
    #              writes can choose a conversation.
    #   members  - a request may name another conversation T. Everybody in T
    #              must already be in the conversation the request came from:
    #              post only where everyone who will see it could already have
    #              seen the conversation it came from. A target that reaches
    #              anybody else is not refused -- it is put to the person who
    #              started the turn, stating how many people outside this
    #              conversation would see it, and written only if they agree.
    #              On a turn an event woke, that person is whoever did the
    #              thing the event reports. A scheduled run has nobody to
    #              ask, so there a widening target is refused instead.
    #   open     - any conversation may be named, and nothing is confirmed.
    # A separate key from history, and it has to be: the widest word inverts
    # between the two. A public target is the safest case for a read -- its
    # membership is self-serve, so the content was already reachable -- and the
    # widest possible audience for a write. One word cannot mean both.
    # Deleting never asks. It removes a message and widens nothing, so there is
    # no audience question to put; it still obeys disabled and origin, which say
    # where the bot may act at all.
    # The narrowest word is "disabled" and not "off" for the same reason it is
    # under history: YAML 1.1 resolves a bare off to the boolean false.
    write: disabled
    # Deprecated predecessor of history above, kept so an existing config keeps
    # working and so that a config upgrade against this template does not delete
    # an operator's list. history wins whenever it names a word, so this is read
    # only by a config that has no history set:
    #   []            -> history: disabled
    #   ["*"]         -> history: origin
    #   ["C0A","C0B"] -> history: disabled, and a warning. history is one word
    #                    for the whole connector, so per-conversation history
    #                    is no longer expressible; write history: origin to
    #                    restore it for every conversation.
    # Setting history is the way to stop the deprecation warning.
    history_digest_channel_ids: []
    # Bounds on a single read_slack_conversation call, used when these are left
    # empty. They assume a reader with room for them: a full scan of a busy
    # channel can run to six figures of characters, which a smaller model
    # context cannot hold and which the context engine will offload, replacing
    # the messages the model just asked for with a summary of them. Lower
    # history_max_messages where that happens -- a call that stops at a bound
    # reports where it stopped, and the model walks the rest of the channel in
    # further calls. The model may ask for fewer than these allow, never more.
    #
    # history_max_messages is the one worth tuning. The rest bound the scan
    # rather than the answer, and exist so that a pathological channel cannot
    # make one tool call run unboundedly.
    history_max_messages: 2000
    # Characters of message text and attachment/reaction labels, across the
    # whole call. Note this counts the text, not the JSON around it, so the
    # payload a model receives is roughly twice this.
    history_max_total_chars: 200000
    # Characters kept from any one message before its text is elided.
    history_max_message_chars: 4000
    # Thread roots examined, Slack API calls made, and users.info lookups spent
    # per call. The lookup budget pays for two things: resolving display names
    # in the answer, and -- under history: visible -- asking Slack whether each
    # person missing from a public target could have read it themselves. A
    # blocking set larger than this budget is a question that could not be
    # finished, so the read is refused rather than allowed; 0 means the tool
    # makes no directory lookups at all, which leaves visible unable to
    # establish anything and refusing every public target.
    history_max_roots_scanned: 10000
    history_max_api_calls: 200
    history_max_user_lookups: 50
    # Wall-clock seconds one scan may take before it returns what it has.
    history_scan_timeout_seconds: 90
    # Seconds one conversation's member list is believed for. Read only when
    # history above allows reading another conversation, and it is the input to
    # a refusal, so a stale copy is wrong for at most this long. Lengthen it
    # where memberships change rarely and channels are large enough that
    # paginating them costs real API calls; shorten it where removing somebody
    # from a channel has to take effect immediately.
    history_members_cache_seconds: 60
    # Offer the agent a second, separate Slack tool that searches the workspace
    # by relevance instead of reading one conversation in order. It answers a
    # different question -- "where was this discussed" rather than "what was
    # said here" -- and neither tool stands in for the other: a turn that
    # cannot search is told so and is never handed history instead.
    #
    # Off by default, because it needs four things and only the first three can
    # be arranged in advance:
    #   * the search:read.public scope on the bot token, which means
    #     reinstalling the app after adding it;
    #   * message search enabled for the workspace;
    #   * a plan tier that offers it;
    #   * a permission Slack issues per inbound message, which exists only for
    #     a message that addressed the bot -- a direct message, or a channel
    #     message that @mentions it.
    # That last one is why a scheduled job can never search, whatever is set
    # here: a cron run has no inbound message and therefore no permission. Such
    # a run is told the tool is unavailable rather than quietly given history.
    #
    # Only public channels are searched, and only public results are returned,
    # whatever the query asks for -- including the conversation the request came
    # from, if that is a direct message or a private channel. This is the whole
    # of the tool's authorization: the search is matched inside Slack, so there
    # is no candidate set here to check membership against, and confining it to
    # what anyone in the workspace could already read is what makes the answer
    # safe to post wherever it was asked for.
    search_enabled: false
    # Optional fallback channel for messages without request metadata.
    # The connector-wide value: a workspace block that names no
    # default_channel_id of its own inherits this one. With more than one
    # workspace configured that is rarely what is wanted, since a channel id
    # names a room in one workspace and nothing at all in another -- set it per
    # block there and leave this empty.
    default_channel_id:
    reply_in_thread: true
    # What the bot reads in channels (direct messages are never affected):
    #   mention - only @mentions (default)
    #   reply   - the above, plus thread replies under the bot's own messages
    #   all     - the above, plus every other channel message
    #   off     - nothing in channels, not even @mentions
    # An unquoted off is the YAML boolean false and is read back as this key's
    # off, so it means what it looks like either way. An unrecognised word falls
    # back to the default.
    # Unlike the Telegram field of the same name these are cumulative: Slack
    # delivers mentions through a separate app_mention subscription, so "reply"
    # and "all" keep answering mentions rather than replacing them.
    # This is the connector-wide default. To give one channel a different set,
    # or a standing prompt, or its own model, write a scope for it -- see the
    # scopes block at the end of this file.
    group_chat_mode: mention
    # How to confirm an accepted request before agent processing begins:
    #   reaction - add acknowledgement_emoji to the request (default, quietest)
    #   text     - post acknowledgement_text as a reply
    #   both     - do both
    #   off      - no acknowledgement
    # An unquoted off is the YAML boolean false and is read back as this key's
    # off, so it means what it looks like either way. An unrecognised word falls
    # back to the default with a warning.
    acknowledge_mode: reaction
    # Deprecated predecessor of acknowledge_mode, kept so an existing config
    # keeps working: true means text, false means off. acknowledge_mode wins
    # whenever it names a mode, so this is only read by a config that has no
    # mode set, and setting acknowledge_mode is the way to stop the deprecation
    # warning. Left empty rather than false so a config upgrade against this
    # template keeps an operator's own true or false; a value-less key is read
    # as unset.
    acknowledge_requests:
    acknowledgement_text: "Received. Analyzing…"
    # The line Slack draws in the thread while the turn is running -- the rung
    # between the acknowledgement above, which is instant, and the activity
    # card below, which waits activity_card_delay_seconds before it appears at
    # all. Free text; Slack shows it beside a spinner.
    #
    # Cleared by the connector itself at every point a turn can end -- a reply
    # posted, a silent finish, an error, a stop, a supersede -- rather than left
    # to clear itself. Slack does drop the status the instant the app posts
    # into that thread, which used to be trusted as the only clear needed, but
    # delivery.reply: optional broke that: a turn whose reply is the NO_REPLY
    # sentinel posts nothing into the thread, so nothing drops the status but
    # this explicit clear. Without it a silent turn's status would stand until
    # Slack's own timeout, two minutes after it was set -- real, but far
    # slower than a reader watching the thread notices. So a fast turn still
    # shows this briefly and a long one still has the activity card by the
    # time it clears, whether or not the turn replied, and there is still
    # nothing here an operator has to clean up -- the connector does it,
    # whichever way the turn ends. The clear is best-effort like the status
    # itself: on a workspace or token that refuses it, Slack's own timeout
    # remains the backstop.
    #
    # Blank to turn it off. It also follows acknowledge_mode: off there is off
    # here too. It is added to the reaction rather than replacing it, so a
    # workspace that will not draw it loses nothing.
    #
    # Needs a thread to be drawn in, which is the same condition the streamed
    # preview has: a DM answered at the top of the conversation gets no status
    # and keeps its reaction.
    thinking_status: "is thinking…"
    # Two siblings of thinking_status, drawn into the same slot rather than a
    # second one: Slack holds one status per thread, so whichever of the three
    # was set most recently is what a reader sees, and each is set at the
    # moment it becomes true.
    #
    # queued_status replaces thinking_status the instant a message is held
    # rather than run, because it arrived while that conversation was already
    # working and delivery.mid_turn is queue there. Without it the thread kept
    # claiming to be thinking about a message that was, in fact, waiting
    # behind another one -- the same contradiction the hourglass reaction next
    # to it would otherwise be the only correct account of.
    #
    # steered_status replaces it the instant a message is folded into a turn
    # already running, under delivery.mid_turn: steer. Nothing new started --
    # an already-running turn absorbed this message -- so "is thinking…" was
    # never wrong for the room, only for what caused this particular status
    # update.
    #
    # Neither has an off switch of its own the way thinking_status does: blank
    # here falls back to the default rather than turning the status off, the
    # same as queued_emoji and the other reaction keys below. Turn all three
    # thread statuses off together with acknowledge_mode: off.
    #
    # Third person throughout, deliberately: the status is drawn for the whole
    # thread to read, not addressed to whoever sent the message that caused
    # it, so "has queued your message" would misstate whose message a second
    # reader in the same thread is looking at.
    queued_status: "has queued a message"
    steered_status: "has steered a message into the running turn"
    # Level for the slack_bolt and slack_sdk logger trees: CRITICAL, ERROR,
    # WARNING (default), INFO or DEBUG. Those two sit outside the jiuwenswarm
    # logger namespace, so without this they have no handler at all and
    # everything they report -- including the exceptions slack_bolt catches on
    # a listener's behalf -- goes nowhere. Setting it points them at the same
    # handlers, and the same redaction, as every other log in the process.
    #
    # Its own key rather than logging.level because they are far chattier:
    # DEBUG writes a line per websocket frame and per dispatched envelope,
    # which answers "did Slack actually send us that message?" and is not
    # something to leave on. Note that logging.console and logging.full still
    # have to allow the level for it to appear; the channel logs the resulting
    # floor when it starts.
    sdk_log_level: WARNING
    # Emoji names without the surrounding colons. Reactions need reactions:write.
    #
    # Six keys for six states a message can be in: running, waiting, finished,
    # broken, halted, never taken. Each is a key rather than a built-in constant
    # so that an operator who finds a mark ambiguous in their workspace -- an
    # emoji their team already uses for something else, a custom one that reads
    # better -- changes one line here instead of waiting for a release.
    #
    # The defaults are picked apart by shape, not by colour: ring, hourglass,
    # tick, cross, square, barred circle. A reaction is drawn small and a reader
    # scanning a conversation sees the outline first, and some readers cannot
    # use colour at all. A replacement is worth choosing on the same basis.
    #
    # Writing "disabled" in place of a name turns that one mark off and leaves
    # the other five working -- the tick below is the usual one to drop, but
    # the word is read the same way for all six. Leaving a key blank does not
    # do this: an empty value falls back to the default beside it, here and for
    # queued_status and steered_status above. To remove every mark at once, and
    # the thread statuses with them, set acknowledge_mode: off instead.
    #
    # "disabled" and not "off" for the reason history and write further down
    # spell their narrowest word the same way: this file is read as YAML 1.1,
    # which resolves a bare off to the boolean false, so it is the one spelling
    # an operator could not write without quoting it. A workspace that really
    # does have a custom emoji named disabled asks for it as :disabled:, colons
    # included -- the word is matched before the colons are stripped.
    #
    # A silenced ending still clears the acknowledgement when the turn stops,
    # so completed_emoji: disabled leaves a finished message bare rather than
    # wearing the "seen" mark for good.
    acknowledgement_emoji: eyes
    # Added when a request is refused: by allow_from, or because the
    # conversation is holding as many waiting messages as it may.
    rejected_emoji: no_entry_sign
    # Added when a message is held rather than run -- it arrived while that
    # conversation was already working, and the conversation is configured to
    # wait for the turn to end instead of interrupting it. Removed again when
    # the held message is dispatched. A conversation left unconfigured holds
    # messages, so this is reached without anyone setting delivery.mid_turn.
    queued_emoji: hourglass_flowing_sand
    # The three endings, each added when the turn stops and each replacing
    # acknowledgement_emoji, so the mark on a message states an outcome rather
    # than the moment it was seen. Without them the acknowledgement is the only
    # mark a message ever gets and it stays for good, so a conversation the bot
    # works through all day ends up a column of identical emoji that separates a
    # turn still running from one that finished hours ago.
    #
    # completed_emoji is added whether or not the turn replied. A turn that read
    # the thread, decided nothing needed saying and stopped is a success, and
    # this is the only trace of it the channel will ever hold. A tick rather
    # than a boxed tick because every processed message gets one, and a wall of
    # green boxes is louder than the fact deserves.
    #
    # failed_emoji is separate from rejected_emoji on purpose. Refused means the
    # request never started -- nothing ran, nothing changed, and the same
    # message may go through later. Failed means the turn started, may have
    # called tools and made outbound requests, and then broke: side effects may
    # exist and someone needs to look. A plain cross rather than a fire or an
    # explosion, both of which already read as approval or as a joke in chat.
    #
    # stopped_emoji is a halted turn: nothing broke and it was not refused, it
    # ran and was deliberately destroyed. Either somebody pressed the stop
    # button, or a later message superseded it under delivery.mid_turn: cancel.
    # One mark for both, because the reader's next step is the same either way:
    # it did not finish, nothing further is coming, ask again if it is still
    # wanted. A media square rather than a stop sign, because the octagon reads
    # as "blocked", which is what rejected_emoji above already means.
    #
    # All three are reaction-only and follow acknowledge_mode, so a deployment
    # on text or off gains no reactions from them.
    completed_emoji: heavy_check_mark
    failed_emoji: x
    stopped_emoji: black_square_for_stop
    # Show the reply as it is written, rather than posting it once when the
    # turn ends. A preview costs API calls from the channel's own budget and
    # produces churn everyone in a shared channel can see, and a scheduled push
    # has no reader waiting on it, so this is off by default.
    #
    # How the preview is written is not configured here. Slack has two ways of
    # doing it and only one works for any given reply -- the newer one needs a
    # thread to reply into, which a DM answered at the top of the conversation
    # does not have -- so the choice is made per reply against what Slack will
    # accept. Turning this on asks for the best available.
    #
    # Approval buttons are only ever shown on a previewed turn, so false also
    # means a task that asks for permission pauses with nothing on screen.
    enable_streaming: false
    # Show what a turn is doing as one in-progress card, rewritten in place as
    # it goes: its todo list, the subagents it dispatched, the tools it ran. A
    # turn that delegates or works through a long tool sequence produces no
    # output at all while it does so -- the agent is blocked -- so without this
    # the channel cannot tell a turn that is working from one that has hung.
    # One card per turn, whatever the width of the work; it reports counts and
    # names -- how many subagents are running and of which type, which tools
    # were called -- and never what any of them was asked to do or returned.
    #
    # What it reports is harness-side only: that something ran, is running, or
    # returned. It does not claim the work succeeded. A subagent's own results
    # never leave the subagent, so a subagent whose commands all failed still
    # shows as complete -- the subagent itself ran fine.
    #
    # Was subagent_status_card, which is still read when this key is absent.
    activity_card: true
    # How long a turn has to still be working before the card is worth posting.
    # A turn that finishes inside this window leaves nothing in the channel at
    # all. Set to 0 to post as soon as the first tool call arrives.
    # Was subagent_card_delay_seconds, still read when this key is absent.
    activity_card_delay_seconds: 5
    # Floor between two intermediate rewrites of that card, so a long turn
    # reports progress without spending an edit per tool call. A subagent
    # returning is never withheld, and neither is the final rewrite: a card is
    # never left claiming a finished turn is live.
    # Was subagent_card_min_edit_seconds, still read when this key is absent.
    activity_card_min_edit_seconds: 10
    # Post a Markdown table as a Block Kit table instead of as preformatted
    # text, which is the one thing Slack mrkdwn cannot express. Everything else
    # in a reply stays mrkdwn either way, and no extra scope is needed: blocks
    # travel in the same chat.postMessage call as the text.
    #   auto   -- render any Markdown table in a reply. The default. A reply can
    #             decline per message with <!-- jiuwenswarm:slack-blocks:off -->.
    #   marker -- render only when the reply itself asks, by including
    #             <!-- jiuwenswarm:slack-blocks --> anywhere in the answer.
    #             Nothing tells the model this marker exists, so this mode does
    #             nothing at all unless you also put it in front of the model
    #             yourself, from a skill or a system prompt.
    #   off    -- never render blocks; the markers are stripped rather than
    #             posted.
    # Anything too large for Block Kit's limits is posted as text unchanged.
    blockkit_tables: auto
    # Which of Slack's two table blocks a Markdown table becomes, once
    # blockkit_tables above has allowed blocks at all:
    #   data_table -- the block that pages, sorts, filters and offers the reader
    #                 a download. The default, because it is the only value that
    #                 cannot cost a reply its table: it holds 200 rows and
    #                 20,000 characters where the plain block holds 100 and
    #                 10,000, and a table past those limits is posted as raw
    #                 pipes rather than trimmed. A table shorter than one page
    #                 is still shown whole, with no pager on screen.
    #   basic      -- a plain "table": every row at once, and none of the
    #                 sorting, filtering or download the other one has.
    #   off        -- no table block at all; the table stays the text it was
    #                 written as. This is about tables only. A chart or a
    #                 hand-written ```blockkit fence in the same reply still
    #                 renders -- blockkit_tables above is what turns those off.
    # An unquoted off is the YAML boolean false and is read back as this key's
    # off, so it means what it looks like either way. An unrecognised word falls
    # back to the default with a warning.
    # Replaces data_table_row_threshold, which picked between the two blocks by
    # counting rows -- a number that could only ever choose between them by
    # accident, since what separates them is what a reader can do with the
    # table rather than how big it is. A config upgrade rewrites the old key
    # into this one: 0 becomes data_table, any other row count becomes basic.
    render_tables: data_table
    # A reply can also hand over Block Kit JSON it wrote itself, in a
    # ```blockkit fence, a diagram in a ```mermaid fence, and a chart
    # specification in a ```vega-lite fence. Five fences decide what is drawn
    # and nothing else does:
    #   ```mermaid   -- drawn as a diagram wherever this connector can draw it.
    #   ```vega-lite -- drawn as a chart, however this connector can draw it.
    #   ```blockkit  -- drawn as the Block Kit blocks the JSON describes.
    #   ```slack-raw -- never drawn; shown as the source it holds.
    #   ```          -- an unnamed fence, likewise never drawn.
    # The first two are the portable ones: a renderer that has never heard of
    # Slack still knows both languages, and one that cannot draw the chart shows
    # a description of it instead. ```blockkit is Slack-only and is the only one
    # blockkit_allowed_block_types below applies to.
    # Charts reach Slack from four of those: a mermaid pie, a mermaid
    # xychart-beta (bar and line), a vega-lite spec (bar, area, line and pie),
    # and hand-written blockkit. mermaid has no area chart of any kind, so an
    # area chart comes from vega-lite or blockkit or not at all. Every parser
    # declines a shape it does not recognise rather than guessing at it: the
    # fence then stays on screen as the source that was written.
    # Naming the language is the whole request: there is no marker to add
    # beside it. The blockkit_tables markers above no longer turn a fence on --
    # they decide table shape. They can still turn one off: blockkit_tables:
    # off, blockkit_tables: marker without the marker, and a reply's own
    # <!-- jiuwenswarm:slack-blocks:off --> each suppress every block in the
    # reply, fences included.
    #
    # Which block types a ```blockkit fence may hold. Empty is the default and
    # means no restriction, because which types Slack draws is Slack's to say
    # and changes without JiuwenSwarm hearing about it -- a name missing from a
    # fixed list costs the whole message its rendering for a block Slack would
    # have drawn. Name types here to restrict a channel to them, e.g.
    #   blockkit_allowed_block_types: [data_table, data_visualization]
    # A value that names nothing usable is logged and read as no restriction.
    # This is a portability preference -- which blocks your clients render well
    # -- and not a safety control: it never decides what a reader can click.
    blockkit_allowed_block_types: []
    # Whether a ```blockkit fence may hold buttons, selects, date pickers and
    # other elements that post back to this app. False, and deliberately a
    # separate key from the list above.
    #
    # JiuwenSwarm posts real permission-approval buttons into these same
    # channels. A reader cannot tell a button a reply drew from a button the
    # approval flow drew -- they are the same pixels, and clicking either sends
    # an interaction to this app. So widening which block types may be drawn
    # must not also widen what a reader can be asked to click. Turning this on
    # is a separate decision.
    # Anything that is not a boolean is logged and read as false.
    blockkit_allow_interactive: false
    # Which Block Kit payloads are checked with Slack's blocks.validate method
    # before they are sent. One of off | risky | all; risky is the default.
    #
    # A send that Slack refuses reports "invalid_blocks" and nothing else, which
    # says something in the payload was wrong and never which thing.
    # blocks.validate answers the same question in advance and, on a refusal,
    # answers with a JSON pointer to the offending element -- so the reader can
    # be shown what failed and where instead of silently losing the formatting.
    # It renders nothing, posts nothing and needs no extra scope.
    #
    # It does cost an API call, and Slack rates the method "Special" without
    # publishing a number. The limit is per method, per workspace, per app, so
    # validation spends from its own budget and cannot slow down message
    # delivery however hard it is used.
    #
    #   off   -- never call it: a refused payload is retried as plain text.
    #   risky -- call it for the payloads a refusal comes from in practice: a
    #            reply's own ```blockkit fence, any message holding controls
    #            to click, and anything unusually large. Everything else is
    #            built here by typed code and is sent unchecked.
    #   all   -- call it for every message that holds blocks.
    #
    # Whatever the setting, a validation that fails, times out or is rate
    # limited is never retried and never delays a message: the payload is sent
    # as it would have been sent anyway, and the after-the-fact fallback still
    # catches a refusal.
    blockkit_validate: risky
    # Group digital avatar (off by default). When on, channel messages also go
    # through the shared IM pipeline, which asks a model whether each one
    # concerns my_user_id and, for replies, whether the answer belongs in the
    # channel or in a DM. Direct messages to the bot are never affected.
    #
    # Only useful with group_chat_mode: all, since the pipeline's job is to
    # filter the channel traffic the bot sees, and the other modes have already
    # narrowed that to mentions or thread replies. In that combination consider
    # acknowledge_mode: off as well, or the bot reacts to every message in the
    # channel including the ones it decides not to answer.
    #
    # Requires my_user_id; the avatar stays off without it. Reading channel
    # history needs channels:history (or groups:history), and resolving display
    # names needs users:read.
    group_digital_avatar: false
    # Slack user ID of the person the avatar speaks for, e.g. U01ABCDEF.
    my_user_id: ""
    # Display name for that person. Resolved from users.info when left empty.
    principal_name: ""
    # Bot display name, used to spot a plain-text "@name" mention that Slack
    # did not turn into a link.
    bot_name: ""
    enable_memory: false
    # Offer the send_file tool to agents answering on Slack. Uploads need
    # files:write on the bot token; set false to withhold the tool entirely.
    send_file_allowed: true
    enabled: false
  whatsapp:
    # WhatsApp 配置（通过本地 Baileys bridge）
    bridge_ws_url: ws://127.0.0.1:19600/ws
    default_jid:
    allow_from: []
    enable_streaming: true
    auto_start_bridge: false
    bridge_command: node scripts/whatsapp-bridge.js
    bridge_workdir:
    enabled: false
  wechat:
    # 个人微信 iLink Bot API 配置
    enable_streaming: false
    base_url: https://ilinkai.weixin.qq.com
    bot_token:
    ilink_bot_id:
    ilink_user_id:
    allow_from: []
    auto_login: true
    qrcode_poll_interval_sec: 2.0
    long_poll_timeout_sec: 45
    backoff_base_sec: 1.0
    backoff_max_sec: 30.0
    credential_file: ~/.wx-ai-bridge/credentials.json
    enabled: false
  wecom:
    # 企业微信 AI 机器人配置
    bot_id:
    secret:
    ws_url: wss://openws.work.weixin.qq.com
    allow_from: []
    enable_streaming: true
    send_thinking_message: false
    enabled: false
    send_file_allowed: true
    # 群聊数字分身（默认关闭）
    group_digital_avatar: false
    my_user_id: ""
    bot_name: ""
    enable_memory: false
  ssh:
    # SSH channel -> MessageHandler（北向）；南向经 gateway.agent_client
    # （type=agentos_router 时由 AgentOS Router 创建 YuanRong 实例并
    # 以 yr:instance:<instance_id>:port=2222 中继到 frontend）。
    # 启用前请安装可选依赖: pip install "jiuwenswarm[ssh]" 或 uv sync --extra ssh
    # 客户端: ssh -p <listen_port> user@<gateway-host>
    # 南向连接参数见 gateway.agentos.ssh；agent_type 跟随用户当前值（3rdagent.switch）。
    enabled: false
    listen_host: "0.0.0.0"
    listen_port: 2222
    host_key_path: ~/.jiuwenswarm/config/ssh_host_key
    relay_timeout_sec: 3600
    auth:
      # 公钥认证开关。true 时校验客户端公钥并签发临时密钥；false 为宽松认证。
      enabled: true
      # TUI 场景: 临时密钥有效期（秒）
      ephemeral_key_ttl_sec: 300
      # 临时密钥类型
      ephemeral_key_type: "ssh-ed25519"
      # 过期清理间隔（秒）
      cleanup_interval_sec: 60

# ========== scopes: per-conversation rules ==========
#
# Rules about *requests* -- which platform, which conversation -- as against
# channels.<platform>, which holds properties of the connector itself. Each
# entry pairs a match with the sections it sets, and later layers win per key:
#
#   layer 0   channels.<platform>.*             connector defaults
#             a scope matching {channel}
#             a scope matching {channel, chat_type}
#             a scope matching {channel, chat}
#             a scope matching {channel, chat, user}
#
# So a scope that sets only the prompt keeps the model and the triggers it did
# not name.
#
# A rule's place in that order is decided by how narrowly it is written, not by
# how many axes it names, and it is read in three steps: the platform first,
# then how finely the conversation is named, then how finely the sender is.
#
#   conversation   absent  <  by kind (chat_type)  <  one room (chat)
#   sender         absent  <  a role, or a bare "not:"  <  a list of ids
#
# The conversation is read before the sender, so {channel, chat} -- everyone in
# one room -- outranks {channel, user} -- this person everywhere on the
# platform. Neither contains the other, so this is a choice rather than a
# consequence: a rule about a room is the one that reads as being about that
# room.
#
# user, role and not count as one axis between them: adding "not:" to a rule
# carves an exemption out of it without promoting it above the rules it was
# sitting under. A role counts as coarser than a list of ids, because how many
# people it holds is settled in roles: rather than in the rule -- so a list of
# ids outranks a role, and a rule naming both a role and ids counts as the
# role. Where two rules cannot be ordered at all -- a role against a bare
# "not:", neither of them a known size -- they tie, and a tie is settled by the
# order the rules are written in: later wins.
#
# A match can also name what kind of conversation it is rather than which one,
# with chat_type: -- a rule for every direct message, or for every group room,
# written once and needing no edit when a new one is opened. The kinds are each
# platform's own words, listed per connector below, and a kind a platform does
# not have is reported at startup and matches nothing. On Slack they are
# channel, group, im and mpim -- a public channel, a private one, a one-to-one
# direct message and a group direct message:
#
#   match: {channel: slack, chat_type: im}
#     every one-to-one direct message with the bot
#   match: {channel: slack, chat_type: channel}
#     every public channel, and no private one -- Slack sends a private
#     channel as "group", so this is narrower than it reads
#   match: {channel: slack, chat_type: [channel, group]}
#     every channel, public or private, and no direct message
#
# One kind or a list of them, and a list ORs: the rule fires for a conversation
# of any kind it names, and for no other. That is how a rule about a class of
# conversation is written once rather than as several rules with the same body
# under them, and it is the same OR user and role already perform between the
# two spellings of the sender.
#
# Naming several kinds does not move the rule: a list sits on exactly the layer
# each of the single-kind rules it replaces sat on, so collapsing two of them
# into one cannot change which rule wins anywhere. Writing the same kind twice
# names it once. An empty list is refused rather than read as "any kind", which
# is the direction every refusal here takes.
#
# chat and chat_type may not appear in the same rule, and that is refused with
# the rule dropped. A named conversation has one type already: writing both is
# redundant where they agree and matches nothing at all where they do not, and
# nothing about the second case would otherwise show. Write chat for one
# conversation, or chat_type for every conversation of that kind.
#
# A match can also name who is asking:
#
#   match: {channel: slack, chat: "C0…", user: ["U0…", "U0…"]}
#     the named senders, in that conversation
#   match: {channel: slack, chat: "C0…", role: admin}
#     anyone in the admin role, in that conversation
#   match: {channel: slack, chat: "C0…", not: {role: admin}}
#     everyone in that conversation except the admins
#
# user is a list even when it names one person, and an id is quoted for the
# same reason a conversation id is. role names a set of people defined under
# the roles: block below; it is the same axis as user, spelled by name instead
# of by id, so the two OR: {user: ["U0…"], role: admin} is that person OR an
# admin, never both at once. The halves combine the same way -- a positive with
# a "not" carved out of it is "these people, minus that one", which is how "the
# team except one person" is written without enumerating the team.
#
# Naming a sender never adds a layer of its own however it is spelled, so
# adding "not:" to {channel, chat, user} leaves it exactly where it was. The
# spelling does change how coarse it counts, and that is the ordering above: a
# role is a set whose size lives in roles: rather than in the rule, so it sits
# under a written-out list of ids.
#
# Every spelling needs channel: alongside it, because an id only means someone
# on the platform that issued it -- and a role resolves to different ids on
# each platform its members are on, so it needs to be told which one. chat and
# chat_type need it for the same reason: an id belongs to one platform, and the
# kinds of conversation are each platform's own words.
#
# What happens when the platform did not say who sent a message decides both
# halves, and it is the same rule for each: an unidentified sender is in no
# list. So a rule written for named people does not apply to them, and a rule
# written to exclude named people still does. Restrictions hold where nobody
# could be identified, rather than lapsing.
#
# Rules only ever narrow: there is no directive that re-opens something a rule
# above already closed. "Restricted, except for these people" is written as the
# restriction with a "not:" on it, which is why the exemption lives in the rule
# it exempts from and can be read there. That holds for every section that is
# given the sender. permissions is not given one, so it is addressed on the
# conversation alone and an exemption cannot be written into it -- see
# permissions below.
#
# A role that the roles: block does not declare is reported and the whole rule
# is dropped, rather than being read as naming nobody: a rule written as
# "not: {role: admin}" whose role name was mistyped would otherwise exclude
# nobody and apply the restriction to exactly the people it was written to
# exempt. Dropping it leaves that conversation on the layer below instead --
# which for a restricting rule means the restriction is not applied, so a
# warning about an unknown role is worth reading.
#
# "not:" on anything but identity is not read; write the conversations out.
#
# A rule's settings are grouped by who acts on them, one section each:
#
#   delivery      the connector: whether and how a message is answered
#                   mode          which messages the bot picks up
#                   prompt        standing text appended after the user's own
#                                 message, and prompt_append to add to it
#                   mid_turn      what a message does when that conversation is
#                                 already working
#                   session       how much of a channel shares one conversation
#                   reply         whether a turn in that conversation owes an
#                                 answer
#                   events        which non-message Slack events that
#                                 conversation keeps for its next turn, or
#                                 starts a turn over
#   agent         the runtime: how the turn is run
#                   model_name    the model that conversation's turns run on
#                   history       how far the Slack history tool may read
#   permissions   the permission engine, before every tool call
#                   tools         per-tool allow/ask/deny, tightening only
#   clicks        the connector, when a button is pressed
#                   approve       who may answer a permission request
#                   stop          who may stop a running turn
#
# delivery.prompt is appended to the message, not given to the model as a
# system prompt: it is visible in the transcript and anything else in the
# message can contradict it. Write it as a request, not as a rule.
#
# What each setting means:
#
#   delivery.mode is the list of triggers that wake the bot in the matched
#   conversations, and any one of them matching is enough:
#     mention  - the bot is @mentioned
#     reply    - a thread reply under a message the bot itself started
#     all      - every channel message, @mentions of the bot included
#     url      - the message contains an http(s) link
#     has_file - the message has an attachment
#   "mention" is NOT implicit, and "all" is the one entry that supplies it: a
#   mode naming neither means the bot ignores @mentions in that conversation,
#   which is a legitimate ingest-only setup but is far more often a slip, so it
#   is logged as a warning naming the conversation. Listing "mention" beside
#   "all" changes nothing and is not warned about, because "+all" written on a
#   conversation that already answers mentions composes to exactly that.
#   An empty list means the bot answers nothing there. An entry that is not one
#   of the five above refuses the whole list with a warning, which leaves that
#   conversation on the layer below rather than on a set nobody wrote. One
#   misspelled trigger therefore drops the rule entirely, and with
#   group_chat_mode: all on the layer below that leaves the conversation
#   answering more than the rule asked for.
#
#   delivery.prompt is appended to every message that triggers there, after the
#   user's own text. Whenever a prompt is appended it is preceded by a line
#   naming which trigger fired -- "[trigger: url]", "[trigger: mention]", and so
#   on, using the same names mode takes. That line is emitted by the connector
#   rather than configured, so a prompt can be written to branch on it and can
#   rely on it always being there. With no prompt to precede it, only "url" and
#   "has_file" are labelled: those are the two that wake the bot for a reason
#   the message does not state, while a mention is in the text and a reply is in
#   the thread. A plain @mention with no prompt gets nothing appended at all.
#
#   delivery.mid_turn says what happens to a message that arrives while that
#   conversation is already running a turn. Chat has one gesture for two
#   intents -- "stop, this is wrong" and "here is one more detail" are both just
#   a message -- and this is where a conversation says which of the two its
#   traffic mostly is:
#     queue   - the message waits, and runs as its own turn once the one in
#               flight ends. Nothing is interrupted and nothing is lost. On
#               Slack the waiting message is marked with channels.slack's
#               queued_emoji so its sender can see it was held; the queue is
#               bounded, and a message arriving when it is full is refused with
#               the rejected_emoji rather than silently dropped. The default:
#               it is the only one of the three that cannot destroy a turn
#               somebody else started, which matters most in exactly the case
#               nobody configured anything for.
#     cancel  - the running turn is stopped and the new message starts a fresh
#               one. Sometimes what the sender meant -- one reason to type
#               while the agent is working is to stop it, and this is the path
#               that kills a runaway command -- but a conversation has to ask
#               for it. Anyone who can post can cancel, including a turn they
#               did not start, and the message that does it is an ordinary one:
#               unlike the stop button there is no click to authorise.
#     steer   - the text joins the turn already running, before its next model
#               call. Nothing is stopped and nothing is started; whoever asked
#               for the work stays the person it belongs to, so a rule about
#               who may stop that turn still names them and not the person who
#               steered it.
#   With no turn in flight the three behave alike: the arriving message is sent
#   normally, because there is nothing to cancel, nothing to steer and nothing
#   to wait for.
#   The three are not grammatically parallel on purpose: cancel and steer act on
#   the turn already running, queue acts on the message that just arrived. A
#   value that is not one of the three is refused with a warning, which leaves
#   that conversation on the layer below rather than on a behaviour nobody
#   wrote -- and the layer below the last of them is "cancel".
#   Note what a shared session means here. On Slack a channel thread is one
#   session for everyone in it, so a queue there is shared: four people typing
#   during a long turn are four turns that will run one after another, in the
#   order they were sent. A DM is keyed on the person and is theirs alone.
#   delivery.session below widens that from the thread to the whole channel,
#   and steer is refused there -- see it for why.
#
#   delivery.session says how much of a Slack channel shares one conversation:
#     thread   - every thread is its own session, with its own history and its
#                own turn. Two threads know nothing of each other and can run
#                at once. The default, and what every deployment has today.
#     channel  - the whole channel is one session. Threads share a history, so
#                the agent has continuity across them and can be asked in one
#                thread about what it was told in another.
#   Replies are unaffected either way. Where an answer goes is settled per
#   message from the thread it was posted in, so a question asked in a thread
#   is still answered in that thread under channel; what changes is the
#   conversation the answer was composed from.
#   A DM ignores this setting. A DM is already one session for the whole
#   conversation -- it is keyed on the person, so its threads already share a
#   history -- so there is nothing left for the setting to do there, and a rule
#   written as {channel: slack} can be used to say "one session per channel"
#   without breaking every DM.
#   Changing this mints a different session id, so it starts a fresh
#   conversation rather than merging what the threads already hold: the history
#   under each old id stays where it is and the room begins with nothing. The
#   same holds in reverse. Change it while a room is quiet.
#   Three things a channel-wide session shares that a thread-wide one does not,
#   worth reading before turning it on:
#     - One turn at a time for the whole channel. A message in any thread
#       arrives mid-turn if any thread is working, so delivery.mid_turn now
#       governs traffic across the room rather than within one thread.
#     - One queue for the whole channel, and it is bounded per session. Under
#       thread a busy room spends one queue per thread; under channel every
#       thread spends the same one, so it fills sooner and a message arriving
#       when it is full is refused with the rejected_emoji.
#     - cancel reaches further. Under mid_turn: cancel a message stops the
#       running turn, and anyone who can post can send one -- unlike the stop
#       button, there is no click to authorise. Under thread that is everyone
#       in your thread; under channel it is everyone in the channel, including
#       people whose thread you have never read. queue, the default, has this
#       problem in neither shape.
#   steer is refused under channel, with one warning naming the conversation,
#   and those messages queue instead. A steer folds a message into the turn
#   already running, and that turn's answer goes wherever it was already going
#   -- under one session for the room that is a thread the steering message was
#   never posted in, and a steer produces one answer in one place by
#   construction. Write session: thread to steer.
#   It may only be written on a rule that matches the channel or the
#   conversation. A rule that also names a user or a role is reported at startup
#   and the key does nothing: a session belongs to a room rather than to whoever
#   is typing in it, and settled per sender one room would hold one history for
#   the people the rule names and another for everybody else.
#
#   delivery.reply says whether a turn in that conversation owes an answer:
#     required - whatever a turn produces is delivered, and a turn with
#                nothing to say has no way to say so. The default, and what
#                every conversation has without this key.
#     optional - a turn may decline to answer. This is not a trigger and is
#                not derived from one: which trigger woke a turn and whether
#                that turn owes an answer are separate questions -- a
#                conversation reading every link posted in it can want an
#                analysis of each, or silence unless one is worth flagging,
#                and mode alone cannot say which.
#   The mechanism is the connector's, not this file's: a message reaching a
#   conversation with reply: optional has an instruction appended, invisible
#   here, telling the model that a reply which is exactly the token NO_REPLY
#   and nothing else is withheld rather than posted, and any other text is
#   posted in full. The token is spelled once, in the code both halves read,
#   so nothing in this config can misspell it or drift from what the matcher
#   accepts.
#   Never a direct message, whatever the rule says. An unanswered DM reads as
#   the bot being broken rather than as a judgement nobody needed to hear --
#   there is no third party in the room for the silence to spare -- so a rule
#   naming a DM as optional has no effect there.
#   It may only be written on a rule that matches the channel or the
#   conversation, the same restriction delivery.session carries and for the
#   same shape of reason: whether an answer is owed belongs to the room rather
#   than to whoever is typing into it, and the reply is matched against the
#   token on the way out, where nothing says which sender it answers. A rule
#   that also names a user or a role is reported at startup and the key does
#   nothing.
#
#   delivery.events says what that conversation does with Slack's non-message
#   events. Reactions, pins and membership changes are state changes rather than
#   things anybody said, and somebody opening this app's App Home is an arrival
#   rather than either, so by default none of them reaches the bot at all. A
#   conversation can ask for them to be recorded where they arrive, with
#   whatever accumulated folded into the next message that wakes the bot for its
#   own reasons -- the model can already read reactions with the history tool,
#   and what that buys is that it sees them without having to think to look. A
#   conversation can also ask for an event to start a turn by itself, which is
#   the narrower setting, applies to three of the four families, and is
#   described under "turn" below.
#
#   It is a mapping of families to one of three words:
#
#       delivery:
#         events:
#           reaction: turn
#           pin: context
#           member: off
#           app_home: context
#
#   The four families are reaction, pin, member and app_home. The first three
#   each cover both directions of one state change: reaction is reaction_added
#   and reaction_removed together, pin is pin_added and pin_removed, member is
#   member_joined_channel and member_left_channel. There is deliberately no way
#   to keep one half -- a room that recorded additions and dropped removals
#   would show the model the emoji that was taken back and the person who left,
#   which is worse than showing it neither, because it looks like knowledge.
#
#   app_home covers one event type because Slack publishes one: app_home_opened,
#   which fires every time somebody enters this app's App Home -- the space
#   holding the Home tab and the direct message with this app -- for either tab.
#   Slack sends nothing for leaving, so there is no half missing. The record
#   carries which tab was opened, home or messages, and is filed under the
#   direct message channel between that person and this app, which is the
#   conversation the Messages tab already is: a rule naming that conversation,
#   or naming {chat_type: im}, is what switches it on.
#
#   The same fact the other way round is the one trap in this mapping. An App
#   Home event arrives in that per-user direct message and nowhere else, so a
#   rule naming a channel never matches one however it is written, while the
#   other three families all arrive in the conversation they are about and are
#   matched by such a rule normally. app_home written on a rule matching
#   {chat_type: channel} or {chat_type: group} is reported at startup, and the
#   rest of the mapping is kept: a reaction or a pin beside it still does what
#   it says on that channel. A rule naming one conversation by id gets no such
#   report, because reading a conversation's kind out of its id is something
#   this connector deliberately does not do -- so app_home under {chat: C...}
#   is inert and says nothing. {channel: slack}, the broadest Slack rule, is
#   the usual home for this family: it matches whatever conversation an event
#   arrives in.
#
#   The three words are:
#     off     - the event is dropped where it arrives. The default: a family
#               this mapping does not name is off, and a conversation nobody
#               wrote a rule for keeps nothing at all.
#     context - the event is kept, and folded into the next turn.
#     turn    - the event starts a turn of its own, straight away.
#
#   An unquoted off is the YAML boolean false and is read back as this key's
#   off, so it means what it looks like either way -- which matters more here
#   than on a key of its own, because a disposition that could not be read
#   refuses the whole mapping and takes the families spelled correctly beside
#   it down with it.
#
#   Where a woken turn's reply goes depends on what the event was about, and
#   there is no setting for it:
#     reaction, pin - in the thread of the message the event was about. A
#                     reaction names that message, so there is a thread to
#                     answer in and the answer sits next to what it is about.
#     member        - at the top level of the channel. A membership change is
#                     about the room and names no message, so there is no
#                     thread; the reply goes where a scheduled job's result
#                     goes, which everybody in the channel sees.
#
#   app_home takes off and context only. turn written on it is refused, the
#   whole mapping is ignored, and a warning names it: a turn woken by somebody
#   opening a tab has no message to answer, and which destination would even be
#   coherent depends on which tab was opened: the Messages tab is the direct
#   message conversation and a reply there is ordinary, while a reply there
#   because somebody clicked the Home tab answers a question nobody asked. No
#   family splits its behaviour on a payload field, and nobody has decided that
#   this one should.
#
#   Switching member: turn on is therefore the loudest of the three, and it
#   covers both halves of the family: member_left_channel as well as
#   member_joined_channel. A turn started by somebody leaving as well as
#   somebody joining is what you get, and a comment at the top of the channel
#   about a departure is a different thing from one greeting an arrival. The
#   family is not splittable -- see above for why keeping one half of a state
#   change is worse than keeping neither -- so write the conversation's prompt
#   with both in mind, or leave member on context.
#
#   What a turn woken by an event is told is written in the connector and
#   nothing here can change it: what kind of event, who did it, which message
#   it was about where there is one, where its reply would land, that nobody
#   addressed the bot, and that silence is the right outcome unless this
#   conversation's own instructions say an event of that kind is a request.
#   Those instructions are delivery.prompt's job, below. A conversation that
#   switches turn on and writes no prompt gets a model that reliably says
#   nothing, which is the intended shape of that configuration rather than a
#   gap in it.
#
#   Five things turn does not do, each of which leaves the event in the buffer
#   for the next turn instead:
#     - it does not start a second turn while that conversation is already
#       working, and does not interrupt one. A burst of reactions produces one
#       turn at most, and so does a bulk invite of twenty people; the rest are
#       carried by whatever is running.
#     - it does not start a turn while somebody has an approval or a question
#       on screen in that conversation.
#     - it does not fire where delivery.reply is required, which is the
#       default. A required reply would oblige the turn to say something about
#       a reaction nobody asked about, so turn is treated as context until that
#       conversation is also set to delivery.reply: optional. This is the
#       conservative reading of two keys that were written separately and is
#       open to revision.
#     - it does not fire for an event whose family answers in a message's
#       thread and which names no message, such as a reaction added to a file.
#       The channel's top level is the member family's destination, not a
#       fallback for a reaction that lost its message.
#     - it does not fire in a direct message, because delivery.reply is never
#       optional there.
#
#   A turn woken by an event can post its reply where the list above says, or
#   stay silent. There is nowhere else for it to post.
#
#   A mapping rather than a list, because a mapping merges per key: a rule on
#   one conversation naming only pin keeps whatever the rule above it said about
#   reaction. A family named twice takes the value of the more specific rule, so
#   a conversation can turn a family the platform rule switched on back off.
#
#   What the bot does about an event is not settled here and cannot be: the
#   folded block states what happened and nothing else. Write the instruction in
#   the same rule's prompt_append -- "when somebody reacts with :bookmark:, save
#   the link" -- where you can read it back.
#
#   Two bounds apply to the buffer per conversation and are the connector's, not
#   this file's. They govern what context keeps, and what turn falls back to
#   keeping whenever it declines to wake one.
#   Each family holds a limited number of events between two turns, separately
#   from the others so that a flood of reactions cannot push out the join that
#   explains who the new person in the room is; past that the oldest go, and the
#   folded block says how many were dropped rather than quietly holding part of
#   a burst. app_home holds the fewest of the four, because it fires on every
#   entry to App Home and every one of its records in a conversation names the
#   same person: the fifth says nothing the first did not, and the dropped count
#   reports the volume. Events older than an hour are dropped too and
#   counted the same way,
#   because a reaction from yesterday folded into this morning's first turn is
#   noise whether or not there was room for it. Nothing is written to disk:
#   restarting the connector forgets whatever a room had collected.
#
#   It may only be written on a rule that matches the channel or the
#   conversation, the same restriction delivery.session and delivery.reply
#   carry. What a room feeds the model belongs to the room: under context the
#   events are folded into whichever turn runs next, which need not be a turn of
#   the sender a rule names, and under turn the event starts a turn nobody sent
#   a message for. The person who reacted is not a sender either way. A rule
#   that also names a user or a role is reported at startup and the key does
#   nothing.
#
#   agent.model_name must name one of the models under models.defaults -- either
#   its "model_name" or its "alias". A name that is not configured is dropped
#   with a warning naming the conversation, the valid names, and the model it
#   will run on instead, because an unknown name would otherwise fall back to
#   the default silently. models.defaults can also be edited from the Web UI: if
#   a model a scope points at is later renamed or removed, that conversation
#   returns to the default and says so once in the log.
#
#   agent.history is how far the Slack history tool may read, in the same four
#   words channels.slack.history takes, each wider than the one before it:
#     disabled - no history tool at all
#     origin   - the conversation the request arrived in, and only that one
#     members  - another conversation may be named, and every named one is
#                checked at read time against everybody in the conversation the
#                request arrived in: they must all be in it as well
#     open     - as members, except that a public channel as the target skips
#                that check
#   channels.slack.history is the same setting one layer down, and is where a
#   deployment that wants one answer everywhere says so without writing a scope
#   at all. Setting both is reported in the usual way, and the scope wins.
#
#   It may only be written on a rule that matches the channel alone:
#   {channel: slack} and nothing else. A rule that also names a chat, a user or
#   a role is reported at startup and the key does nothing -- so a restriction
#   written on the wrong axis is never quietly read as a grant.
#
#   That is a fact about the setting rather than about Slack, which does
#   populate a sender and does match model_name on one. Who is asking is
#   already settled, per request, by the membership rule above; a second and
#   static answer on the same axis is redundant where it agrees and grants what
#   membership was withholding where it does not. It is also what keeps "not:"
#   safe here, since a role that resolves to nobody excludes nobody and would
#   hand the grant to exactly the people the rule was written to exempt. A
#   conversation is not the unit either: the membership rule already decides
#   per target, which is finer than any list of rooms could be.
#
#   permissions.tools narrows what the agent may do in the matched
#   conversations: {bash: ask} turns an allowed bash into one that asks first,
#   {bash: deny} refuses it outright. It can only tighten -- writing allow
#   grants nothing and is warned about -- so a scope can never be used to open
#   a tool the permissions block below has closed. Levels from several matching
#   scopes combine to the strictest of them, whatever order they are written in.
#   On a channel where nobody can answer an approval, cron and the heartbeat
#   being the two, ask is enforced as deny: a scheduled job that touches a
#   restricted tool fails with a reason rather than waiting for a click that
#   never comes.
#
#   One limit worth knowing before relying on it. The permissions block below
#   is evaluated in a fixed order, and only a deny is checked first: an
#   approval_overrides entry (what "always allow" writes) or a rules entry with
#   action: allow is consulted before a tool's own level. Narrowing a tool to
#   deny therefore always holds. Narrowing it to ask holds against
#   approval_overrides -- those are set aside for the tools a scope narrowed --
#   but a rules entry that allows the same tool still wins, and that case is
#   logged as a warning naming the rule. Use deny when the restriction has to be
#   certain.
#
#   permissions is matched on channel and chat, and not on who is asking. The
#   permission engine settles it at the tool call, where the conversation is
#   known and the sender is not, so an identity axis on such a rule is read by
#   nobody -- and the two spellings fail differently. A positive user: or role:
#   never fires at all, so the narrowing an operator wrote is simply absent. A
#   "not:" fires for everybody including the people it names, so an exemption
#   written as "everyone except the admins" takes the tool away from the admins
#   too. Neither is visible from this file, so a rule that names a sender and
#   has a permissions section is reported at startup and the section is
#   dropped, leaving that conversation on the layer below. Write it on the
#   channel or the conversation; a tool taken away from one person is written in
#   the permissions block below rather than in a scope.
#
#   That bar is on today's runtime rather than on the section, and it lifts when
#   the sender reaches the permission path. "Restricted, except for the admins"
#   is the shape this section is designed for and the matcher already
#   understands it, so the rule that cannot be written now is expected back.
#
#   clicks says who may press the buttons the bot posts in the matched
#   conversations. It is a different question from everything above it: those
#   settle what a *message* causes, and a click is not a message -- it arrives
#   against a turn that already exists, from someone who may not have started
#   it, and it has its own principal. Two buttons exist:
#     approve  - the yes/no on a tool call the agent stopped at
#     stop     - the red button on the activity card of a running turn
#   Each names people the way a match does, by id or by role, and the two OR:
#     clicks:
#       approve: {role: operator}
#       stop:    {role: [operator, member]}
#   With no clicks rule, the conversation is gated by whatever it was gated by
#   before -- on Slack that is channels.slack.allow_from, which is empty by
#   default and means anyone who can see the message can press the button. A
#   clicks rule only ever narrows that; it can never let someone through who
#   allow_from keeps out.
#
#   Two things follow from that and are worth knowing before writing one.
#
#   Whoever started a turn may always stop it. That is not conferred by
#   clicks.stop and cannot be taken away by it: a rule narrows who *else* may.
#   There is deliberately no equivalent on approve -- starting a turn is no
#   claim to answer what it goes on to ask.
#
#   Where a rule is written and the platform did not say who clicked, the click
#   is refused. That is the opposite of the rule for an unidentified *sender*
#   above, which falls out of positive lists and stays inside restrictions, and
#   it is deliberate: a written restriction must not quietly become no
#   restriction because a fact went missing. The same answer covers a role
#   whose members have no id on that platform -- they are not in the role
#   there, so the rule admits nobody and every click is refused, which is
#   warned about at startup naming the conversation. A role name the roles:
#   block does not declare is different again: the clause is dropped and the
#   click goes back to being gated by allow_from alone, so that warning is one
#   to read.
#
#   A rule that also names a sender cannot have a clicks section: the match's
#   user and role name whoever sent a message, which is not who pressed the
#   button, and nothing resolves the two together. Write clicks on a rule that
#   matches the channel or the conversation.
#
#   A channel that renders no buttons -- cron and the heartbeat -- reports a
#   clicks section as having no effect, in the ordinary way it reports any
#   section it does not read. That is a rule written against the wrong channel,
#   and it is a different report from the one above.
#
#   There is deliberately no per-conversation reasoning level. A reasoning level
#   is fixed when a model entry is built, so the way to give a conversation a
#   different one is to add a second models.defaults entry with that level and
#   point the scope at it by name.
#
#   There is deliberately no per-conversation work_mode, for a related reason:
#   it is not a per-turn setting either. The runtime writes a session's
#   work_mode the first time it sees that session and never changes it
#   afterwards, so that a conversation cannot switch which project it belongs
#   to halfway through. A scope setting it would apply only to conversations
#   that have not spoken yet, be ignored for every one that has, and say
#   nothing either way -- and on Slack a session is keyed on the person in a DM
#   and, by default, on the thread in a channel, so the conversations already in
#   use would never pick it up at all.
#
# A conversation a scope names is opted in by that alone. On Slack it is
# therefore exempt from channels.slack.allowed_channel_ids: both are
# hand-written ids in this file, and requiring the same conversation in two
# lists before the bot would answer there is redundancy rather than protection.
#
# How a value composes is decided by its type, not by its name:
#   scalar        replaces        model_name: "deepseek-v3"
#                                 mid_turn: steer
#                                 session: channel
#   list          a set: replaces by default, or mutates the inherited set when
#                 every entry is signed
#                     mode: [mention, url]   replace
#                     mode: [+has_file]      inherit, plus has_file
#                     mode: [-mention]       inherit, minus mention
#                 Every entry signed or none of them: [mention, +has_file] is
#                 ambiguous and is ignored with a warning.
#   prose         replaces; <key>_append appends to whatever layer set it
#                     prompt: "..."          replace
#                     prompt_append: "..."   add a paragraph
#
# A channel only reads the settings it declares; a scope naming a channel that
# does not support scopes, an axis it cannot fill, or a setting it ignores is
# reported at startup and does nothing. Nothing here can fail a start.
#
# This version matches on every axis there is -- channel, chat, chat_type, user,
# role and not -- and reads all four sections: delivery, agent, permissions and
# clicks.
#
#   scopes:
#     - match:    {channel: slack}
#       delivery: {mode: [mention, url]}
#       agent:    {history: origin}
#     - match:    {channel: slack, chat_type: im}
#       delivery: {mode: [all]}
#     - match:    {channel: slack, chat: "C000000AAAA"}
#       delivery:
#         mode: [+has_file]
#         prompt: "Fetch the linked page first. Answer in English."
#       agent:
#         model_name: "deepseek-v3"
#     - match:    {channel: slack, chat: "C000000BBBB"}
#       delivery:
#         prompt_append: "This is a support channel. Be terse."
#         mid_turn: queue
#         session: channel
#       permissions:
#         tools: {bash: ask}
#       clicks:
#         approve: {user: ["U000000AAAA"]}
#     - match:    {channel: slack, chat: "C000000BBBB", user: ["U000000AAAA"]}
#       delivery: {prompt_append: "Answer this person in French."}
#     - match:
#         channel: slack
#         chat:    "C000000BBBB"
#         not:     {user: ["U000000AAAA"]}
#       delivery: {mode: [mention]}
#     - match:       {channel: "__cron__"}
#       permissions:
#         tools: {bash: deny}
#
# A scope that sets only permissions or only clicks does not opt its
# conversation into being answered: the ids that exempt a Slack channel from
# allowed_channel_ids come from delivery or model/history agent settings, so a
# rule written to take something away cannot hand something else out.
# A scope that sets only agent.subagents or agent.skills also does not opt a
# channel in. Omitted available inherits the global skill library. available: []
# allows no skills. Clear inherited required skills with required: [] as well.
# Omitted required loads none when no broader scope set it.
# Each skills subkey replaces its own list in a more specific scope.
# To restrict delegation or skill loading in an existing room, add these under
# its agent: block:
#   subagents: [research_agent]   # Only these enabled agents are callable.
#   skills:
#     available: [ambient, research]  # Skills the agent may load.
#     required: [ambient]             # Full skill text loaded for every turn.
#
# Quote conversation ids, or YAML may reinterpret one that looks numeric.
# An empty list rather than a bare key: entries are whole rules rather than
# operator-named sub-keys, so a config upgrade keeps the list intact.
scopes: []

# ========== people / roles ==========
#
# Who a name in a scope refers to. Two blocks, and neither of them grants
# anything: people: maps a person to their id on each platform, roles: groups
# those people under a name, and every rule about what may happen stays in
# scopes: above. A role with a tools: block under it is refused with that
# reason -- authority in two places is how "who can actually do this here"
# stops being answerable by reading one list.
#
#   people:
#     alice: {slack: "U000000AAAA", feishu: "ou_a1b2c3"}
#     bob:   {slack: "U000000BBBB"}
#
#   roles:
#     admin: [alice, bob]
#
# Written that way, the last two rules of the scopes example above become one
# rule that reads as what it does, and stops needing an edit every time
# somebody joins:
#
#   scopes:
#     - match:
#         channel: slack
#         chat:    "C000000BBBB"
#         not:     {role: admin}
#       delivery: {mode: [mention]}
#
# -- everyone in that conversation except an admin has to @mention the bot, and
# an admin matches no restricting rule and keeps whatever the layer below gives
# them. That is the "restricted, except for these people" shape described
# under scopes above.
#
# The same shape cannot have a permissions section today. That one is settled
# at the tool call with no sender, so a "not:" written into it would fire for
# the admins as well and take the tool away from exactly the people the rule
# exempts. It is reported and dropped rather than applied -- the reason is with
# permissions above -- and it comes back when the sender reaches the permission
# path. Until then, a tool taken away from everyone but the admins is written
# in the permissions block below and not as a scope.
#
# Why the platform id lives with the person rather than with the role: one
# human has one entry, so adding a platform to somebody is a single line and
# every role they are in follows. The name on the left is yours -- it is never
# shown to anyone and never matched against anything, it only has to be the
# same word the roles: block uses.
#
# A platform where more than one id can identify the same person -- Feishu's
# open_id and union_id are the standing case -- takes a list, and whichever of
# them the event held matches:
#
#   people:
#     carol: {feishu: ["ou_a1b2c3", "on_d4e5f6"]}
#
# Two rules that decide what happens when something is missing, both erring the
# same way -- a rule reaches no further than it was written to reach:
#
#   A person with no id for a platform is not in the role there. So a rule
#   written as "everyone except the admins" does apply to an admin whose id for
#   that platform is not listed here: restrictions hold where nobody could be
#   identified, rather than lapsing. This is logged at startup naming the role
#   and the platform, because it is the one that silently restricts the wrong
#   person.
#
#   A role named in a scope but not declared here drops that whole scope, and
#   so does a roles: entry naming somebody who is not in people:. Both are
#   configs that cannot be honoured rather than configs that mean "nobody", and
#   dropping leaves the conversation on the layer below -- which for a
#   restricting rule means the restriction is not applied at all. Both are
#   logged.
#
# Role nesting is not supported: a role holds people, not other roles. A
# hierarchy is where "who can actually do this" stops being answerable by
# reading, and listing the people out costs a line.
#
# Left bare rather than written as {}: the names under them are yours, and this
# template doubles as the key allow-list on upgrade -- an empty mapping would
# be read as the complete set of names allowed and would delete every one you
# wrote.
people:
roles:

# ========== 细粒度权限管控（tiered_policy）==========
#
# schema: tiered_policy（或兼容 v_cc / v4.2）时由 tiered_policy.evaluate_tiered_policy 求值；
# permission_mode: normal|strict 决定 severity 映射，见 agentserver/permissions/tiered_policy.py。
# severity（normal）：LOW/MEDIUM→allow，HIGH/CRITICAL→ask；strict 下 MEDIUM→ask、CRITICAL→deny。
# rules[*].action: 可选显式动作 allow|ask|deny；配置后优先于 severity 映射，适合敏感文件读取、
# 系统控制等不希望随 permission_mode 漂移的规则。
# 内置参数规则 > 用户 rules；整工具存在则不用 defaults；详见 tiered_policy 模块说明。
#
# 三种动作: allow / ask / deny
permissions:
  enabled: false
  schema: tiered_policy
  permission_mode: normal
  # Host-only. Inject agent-core package builtin_rules.yaml (command rules +
  # sensitive_paths + net_urls). Default true; User/Session cannot override.
  package_builtin_rules: true
  # 缺省两项为 true。产品关闭结构地板与解释器汇点；危险命令仍走 builtin / rules。
  shell_guard:
    unknown_structure: false
    interpreter_sink: false
  mode: manual

  defaults:
    "*": "allow"

  tools:
    bash: allow
    powershell: allow
    mcp_exec_command: allow
    create_terminal: allow
    write: allow
    write_file: allow
    edit_file: allow
    search_replace: allow
    # ask_user 只向用户提问，不修改系统，自动放行避免权限中断阻塞问题选项呈现
    ask_user: allow
    write_memory: allow
    edit_memory: allow
    read_memory: allow
    memory_search: allow
    memory_get: allow
    todo_create: allow
    todo_insert: allow
    todo_complete: allow
    todo_remove: allow
    todo_list: allow
    # Coding Memory 工具权限
    coding_memory_write: allow
    coding_memory_edit: allow
    coding_memory_read: allow
    # 外接记忆工具（External Memory — OpenJiuwen / Mem0 / OpenViking）
    ltm_search: allow
    ltm_search_summary: allow
    mem0_profile: allow
    mem0_search: allow
    mem0_conclude: allow
    viking_search: allow
    viking_read: allow
    viking_browse: allow
    viking_remember: allow
    viking_add_resource: allow
    mcp_free_search: allow
    mcp_paid_search: allow
    mcp_fetch_webpage: allow
    cron_list_jobs: allow
    cron_get_job: allow
    cron_create_job: allow
    cron_update_job: allow
    cron_delete_job: allow
    cron_toggle_job: allow
    cron_preview_job: allow
    # Heartbeat 任务工具，与 cron_* 同级；两份分布式 team 配置已在发布，
    # 这里补齐后默认实例才有同样的条目可供覆盖。
    heartbeat_list_jobs: allow
    heartbeat_get_job: allow
    heartbeat_create_job: allow
    heartbeat_update_job: allow
    heartbeat_delete_job: allow
    heartbeat_toggle_job: allow
    heartbeat_preview_job: allow
    heartbeat_run_now: allow
    heartbeat_cancel_run: allow
    acp_chat: ask
    # Slack canvases: two of the six tools open a door that does not shut, and
    # neither is listed above, because listing one here would decide for every
    # deployment what only an operator can decide. Write them in yourself if
    # the reasoning below applies:
    #
    #   delete_slack_canvas: ask
    #
    # A canvas it deletes is gone -- Slack keeps no copy, has no undelete, and
    # tells nobody -- so the tool is worth an ask wherever a canvas holds
    # anything a person would miss. The same line under a scopes: rule narrows
    # one conversation rather than the whole deployment, and under
    # match: {channel: "__cron__"} it is enforced as deny, because a scheduled
    # run has nobody to answer the question.
    #
    # The second door is an argument rather than a tool: share_slack_canvas
    # with access_level: owner transfers ownership of a canvas to a person, and
    # nothing gives it back except that person. permissions.tools is keyed by
    # tool name and cannot see an argument, so narrowing that one means
    # narrowing share_slack_canvas as a whole -- which also stops every
    # ordinary read and write grant. Worth doing where ownership matters more
    # than sharing does; not worth doing by default, which is why it is written
    # here rather than applied above.
    #
    # Slack Lists: the same shape of decision, and none of the five is listed
    # above for the same reason. Write these in yourself where the reasoning
    # applies:
    #
    #   delete_slack_list: ask
    #
    # A List it deletes is gone with every row in it -- Slack keeps no copy and
    # has no undelete -- and the call behind it is files.delete, which deletes
    # any file at all. The tool refuses an id Slack does not confirm is a List,
    # so the capability is no wider than the name; the ask is for the deletion
    # itself. Under match: {channel: "__cron__"} it is enforced as deny, a
    # scheduled run having nobody to answer the question.
    #
    #   write_slack_list: ask
    #
    # Not because creating is destructive but because it is unrepeatable: a
    # List's columns are fixed at creation and no Slack method changes them
    # afterwards, so a List created with the wrong ones is abandoned rather
    # than repaired, and a workspace has a ceiling on how many Lists it may
    # hold. Worth an ask where that ceiling is close, or where somebody else
    # curates the workspace's Lists; not worth one by default.
    #
    # The third door is an argument rather than a tool: share_slack_list with
    # access_level: owner transfers ownership to a person, and nothing gives it
    # back except that person. permissions.tools is keyed by tool name and
    # cannot see an argument, so narrowing that one means narrowing
    # share_slack_list as a whole -- which also stops every ordinary read and
    # write grant.

  rules:
    - id: shell_allow_dir
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "dir *"
      severity: LOW
    - id: shell_allow_ls
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "ls *"
      severity: LOW
    - id: shell_allow_pwd
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "pwd *"
      severity: LOW
    - id: shell_allow_cd
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "cd *"
      severity: LOW
    - id: shell_allow_echo
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "echo *"
      severity: LOW
    - id: shell_allow_cat
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "cat *"
      severity: LOW
    - id: shell_allow_type
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "type *"
      severity: LOW
    - id: shell_allow_head
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "head *"
      severity: LOW
    - id: shell_allow_tail
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "tail *"
      severity: LOW
    - id: shell_allow_git_status
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "git status *"
      severity: LOW
    - id: shell_allow_git_log
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "git log *"
      severity: LOW
    - id: shell_allow_git_diff
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "git diff *"
      severity: LOW
    - id: shell_allow_git_branch
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "git branch *"
      severity: LOW
    # PowerShell cmdlet / alias counterparts of cd, pwd, ls/dir, cat/type, echo, head/tail
    - id: shell_allow_set_location
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "Set-Location *"
      severity: LOW
    - id: shell_allow_push_location
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "Push-Location *"
      severity: LOW
    - id: shell_allow_pop_location
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "Pop-Location *"
      severity: LOW
    - id: shell_allow_sl
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "sl *"
      severity: LOW
    - id: shell_allow_chdir
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "chdir *"
      severity: LOW
    - id: shell_allow_get_location
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "Get-Location *"
      severity: LOW
    - id: shell_allow_gl
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "gl *"
      severity: LOW
    - id: shell_allow_get_childitem
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "Get-ChildItem *"
      severity: LOW
    - id: shell_allow_gci
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "gci *"
      severity: LOW
    - id: shell_allow_get_item
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "Get-Item *"
      severity: LOW
    - id: shell_allow_gi
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "gi *"
      severity: LOW
    - id: shell_allow_get_content
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "Get-Content *"
      severity: LOW
    - id: shell_allow_gc
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "gc *"
      severity: LOW
    - id: shell_allow_write_output
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "Write-Output *"
      severity: LOW
    - id: shell_allow_write_host
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "Write-Host *"
      severity: LOW
    - id: shell_allow_select_object
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: 're:(?i)^Select-Object\b'
      severity: LOW
    - id: shell_ask_rm
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "rm *"
      severity: HIGH
    - id: shell_ask_del
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "del *"
      severity: HIGH
    - id: shell_ask_rd
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "rd *"
      severity: HIGH
    - id: shell_ask_remove_item
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "Remove-Item *"
      severity: HIGH
    - id: shell_ask_ri
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "ri *"
      severity: HIGH
    - id: shell_ask_rmdir
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "rmdir *"
      severity: HIGH
    - id: shell_ask_erase
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: "erase *"
      severity: HIGH
    - id: shell_ask_sensitive_file_reads
      tools: [bash, powershell, mcp_exec_command, create_terminal]
      pattern: 're:(?i)(^|[\s;&|()])((cat|type|less|more|head|tail|grep|find|Get-Content|Select-String)\b[^;&|]*(id_rsa|id_ed25519|\.pem\b|\.pfx\b|\.key\b|\.kube/config|\.aws/(credentials|config)|\.npmrc\b|\.env(\.[A-Za-z0-9_-]+)?\b|authorized_keys|\.ssh/))'
      severity: HIGH
    # path_ask_* 已迁到 file_guard.paths（match: glob）；Pipeline A 不再重复匹配。
    # - id: path_ask_ssh / path_ask_env → 见下方 file_guard.paths

  # 数字分身 owner-scoped 权限（默认空，不生效）。键是 channel_id，由操作员或
  # Web 设置页写入，本模板无从预知。留空而不是 {}：模板同时充当升级时的键
  # 白名单，写成映射会被当作允许的子键全集，写进去的授权会被 _deep_merge
  # 一并删掉——包括设置页刚刚保存的那一份。
  owner_scopes:
  deny_guidance_message: ""

  # Native 路径层（agent-core FileGuard）。P1 起包内 sensitive_paths 在 file_guard.enabled
  # 时注入（.ssh / .env / 私钥为 deny，家目录凭证为 ask）；下面 glob 可与目录重复，更严者胜。
  file_guard:
    enabled: true
    defaults:
      read: ask
      write: ask
      exec: ask
    workspace:
      read: allow
      write: allow
      exec: ask
    paths:
      - path: "**/.ssh/**"
        match: glob
        read: ask
        write: ask
        exec: ask
      - path: "**/.env*"
        match: glob
        read: ask
        write: ask
        exec: ask

  # Legacy external_directory：仅作兼容；启用上方 Native file_guard 后 "*" 不再驱动路径层。
  # 新信任目录写入 file_guard.paths（/add-dir），勿再写本键具名 allow。
  external_directory:
    "*": "ask"

browser:
  # chrome_path can be a string or per-OS map.
  # Example:
  # chrome_path:
  #   windows: "C:\\Users\\YOUR_USER\\AppData\\Local\\Google\\Chrome\\Application\\chrome.exe"
  #   macos: "/Applications/Google Chrome.app"
  #   linux: "/usr/bin/google-chrome"
  chrome_path: ""
  # true runs Chrome without a visible window; false opens a managed window.
  headless: true

updater:
  enabled: true
  # 桌面端版本检查源类型：gitcode / github
  desktop_release_api_type: "gitcode"
  repo_owner: openJiuwen
  repo_name: jiuwenswarm 
  release_api_url: ""
  # Windows/macOS use .exe/.dmg; multiple candidates prefer a unique WorkSwarm name.
  # One pattern per platform, each falling back to asset_name_pattern below when
  # empty. UpdaterService reads all four and the Web settings page writes all
  # four, so all four are listed here: a key this template omits is deleted from
  # the operator's config on the next service start, which silently undid a
  # pattern set from the settings page.
  asset_name_pattern_windows: ""
  asset_name_pattern_macos: ""
  asset_name_pattern_linux: "JiuwenSwarm-{version}.tar.gz"
  # Fallback for whichever platform pattern above is left empty.
  asset_name_pattern: ""
  timeout_seconds: 20
  pypi_mirror: "https://mirrors.aliyun.com/pypi"

extensions:
  # 扩展包搜索目录（字符串），用 ';' 分割多个目录：
  # EXTENSION_DIRS="E:/a;D:/b"
  extension_dirs: ${EXTENSION_DIRS:-jiuwenswarm/extensions}

# ============================================================
# Hooks 配置
# 17 个事件类型，支持 command / prompt 两种 hook 类型
# 字段说明：
#   - disable_all_hooks: 全局关闭所有 hooks
#   - <事件名>:
#       - matcher: 匹配表达式（工具名|管道OR|正则|"*"）
#       - hooks:
#           - type: command | prompt
#           - command / prompt: 执行的命令或 prompt 模板
#             支持 $ARGUMENTS（hook input JSON）和 $TOOL_NAME 变量
#           - timeout: 超时秒数（默认 30s）
#           - shell: bash | sh | zsh（仅 command 类型）
#           - model: LLM 模型名（仅 prompt 类型，空则用默认轻量模型）
#           - status_message: 执行时显示的提示信息
# 退出码语义（command 类型）：
#   0 = 成功继续  2 = 阻止执行  其他 = 非阻塞错误
# ============================================================
hooks:
  disable_all_hooks: false

  # PreToolUse: 工具执行前拦截
  # PreToolUse:
  #   - matcher: "Write|Edit"
  #     hooks:
  #       - type: command
  #         command: "echo 'about to write file'"
  #         timeout: 30
  #         shell: "bash"
  #         status_message: "Running pre-write hook..."

  # PostToolUse: 工具执行后拦截
  # PostToolUse:
  #   - matcher: "Bash"
  #     hooks:
  #       - type: prompt
  #         prompt: "审查命令输出安全性: $ARGUMENTS"
  #         timeout: 15

  # SessionStart: 会话开始时
  # SessionStart:
  #   - matcher: "*"
  #     hooks:
  #       - type: command
  #         command: "echo 'session started'"

  # Stop: Agent 结束前
  # Stop:
  #   - matcher: "*"
  #     hooks:
  #       - type: command
  #         command: "echo 'agent stopping'"


mcp:
  servers: []
  # 示例：
  # servers:
  #   - name: playwright
  #     enabled: true
  #     transport: stdio
  #     command: python
  #     args: ["path/to/server.py", "--transport", "stdio"]
  #     cwd: .
  #     env:
  #       LOG_LEVEL: INFO
  #   - name: local-sse
  #     enabled: false
  #     transport: sse
  #     url: http://127.0.0.1:9000/sse
  #     headers:
  #       Authorization: Bearer ${MCP_TOKEN}
  #     timeout_s: 30


modes:
  # 一级模式 agent / code / team
  agent:
    # plan / fast 已合并为单一 agent 模式：记忆固定被动（is_proactive 开关已下线）。
    memory:
      enabled: true
    rails:
    tools:
  code:
    # 记忆开关 — 控制 CodingMemoryRail 和 ProjectMemoryRail 加载
    # 关闭后，coding_memory_read/write/edit 工具不可用，项目记忆文件不自动加载
    memory:
      enabled: true

    # SDD 开关 — 控制 DesignRail 加载（wave1：需求分析与设计阶段）
    # 开启后对 Agent 说"需求分析"即进入 SDD 流程，按阶段产出 RAS/RDS
    # 关闭（默认）时 Agent 行为与未引入 SDD 旧版本完全一致（NFR-001）
    sdd:
      enabled: false

    # 动态 Rails — 列表中出现的 = 启用；不出现的 = 不启用
    # 固定 Rails（以下 Rails 已在代码中固定挂载，无需在此配置）：
    #   RuntimePromptRail, ResponsePromptRail, JiuSwarmStreamEventRail, SecurityRail,
    #   PermissionInterruptRail, SysOperationRail(FileSystemRail), LspRail,
    #   AgentModeRail, StructuredAskUserRail, ConfirmInterruptRail, ContextProcessorRail
    # 注意：ProjectMemoryRail, CodingMemoryRail 受 memory.enabled 开关控制，
    #       开关关闭时不加载，开关开启时固定挂载。
    rails:
      - SkillUseRail
      - WorktreeRail

    # 动态 Tools — 列表中出现的 = 启用
    # send_file_to_user 由运行时 _update_session_tools 注册，不在此配置
    # coding_memory_read/write/edit 由 CodingMemoryRail 在 subagent 内部注册，不在此配置
    tools:
      - web_free_search
      - web_fetch_webpage
      - web_paid_search
      - user_todos
      - skill_toolkit
      - skill_retrieval

    embedding_config:
      model_name: null
      base_url: null
      api_key: null
  team:
    jiuwen_team:
      team_name: jiuwen_team
      lifecycle: persistent
      teammate_mode: build_mode
      spawn_mode: inprocess
      enable_swarmflow: false
      external_cli_agents: []
      external_transport: null

      # Team-level token budget ceiling for swarmflow runs.
      # Unset / null = unbounded (no ceiling).  Set to a positive integer to
      # cap total tokens across ALL swarmflow runs spawned by this team.
      # swarmflow_budget: 500000

      # Proactive reliability monitoring for team leaders and teammates.
      reliability:
        enabled: true
        monitor_roles:
          - leader
          - teammate

        detectors:
          tool_error:
            enabled: true
            window_seconds: 60.0
            rate_threshold: 5
            consecutive_threshold: 3

          repeat_tool:
            enabled: true
            history_size: 30
            repeat_warn: 10
            pingpong_warn: 10
            loop_block: 20
            global_stop: 30

          model_error:
            enabled: true
            window_seconds: 120.0
            rate_threshold: 3
            consecutive_threshold: 2

          output_length:
            enabled: true
            text_threshold: 32000
            thinking_threshold: 16000

          compaction:
            enabled: true
            window_seconds: 300.0
            frequency_threshold: 3
            drop_ratio: 0.3

          pingpong:
            enabled: true
            min_volleys: 6

        policy:
          severity_actions:
            low:
              - observe_only
            medium:
              - report_leader
            high:
              - local_steer
              - report_leader
            critical:
              - local_steer
              - escalate_user

        restart_intensity:
          intensity: 5
          period_seconds: 60.0

      # SwarmFlow per-Leader concurrency caps (three-layer governor).
      # Only effective when enable_swarmflow is true.
      #   max_workflows:    L1 — max concurrent workflow runs under one leader (>=1).
      #   agents_per_run:   L2 — per-run agent admission cap (optional; None uses
      #                          the engine's default agents-per-run resolution).
      #   max_agents_total: L3 — global agent admission across all runs (>=1).
      swarmflow_concurrency:
        max_workflows: 16
        agents_per_run: null
        max_agents_total: 64

      # Enable the host-managed worktree capability used by team members and
      # SwarmFlow agent calls with options.isolation="worktree".
      worktree:
        enabled: true

      # 任务调度模式（TeamAgentSpec.dispatch_mode，静态配置，运行时不可切换）：
      #   autonomous（默认）— 任务放到共享看板，成员按专长自行认领，
      #                        leader 通过 send_message 广播启动。
      #   scheduled        — leader 把每个任务预先指派给具名成员，
      #                        F_62 调度运行时（agent/scheduling）统一处理
      #                        start / 送审 / 返工 / 验收等 leader 身份的
      #                        邮箱消息；成员失去 claim_task，改用
      #                        member_complete_task。
      dispatch_mode: autonomous

      # 调度模式下的验收开关（TeamAgentSpec.enable_task_verification）：
      # 纯 prompt 驱动，开启后 leader 建任务时会按自己的判断给部分任务
      # 指派 0..N 个 reviewer（无强制校验，leader 认为无需验收的任务可以
      # 不带 reviewer）。reviewer 机制（列、guard、投票）本身始终可用，
      # 与本开关无关；本开关只影响 leader 的建任务引导语。见 F_62。
      enable_task_verification: false

      leader:
        member_name: team-leader
        display_name: 团队领导
        persona: "天才项目管理专家，擅长任务分解和团队协调"

      agents:
        leader: $agent_leader

      workspace:
        enabled: true

      transport:
        type: inprocess

      storage:
        type: sqlite

      # ============================================================
      # Team 级共享记忆（TeamMemoryConfig）
      # ============================================================
      # 与常规 Agent 的 per-session 记忆不同，Team 记忆是一个独立的、
      # 跨成员的共享记忆系统，由 TeamMemoryManager 统一管理。
      #
      # 启用后，每个 Team 成员的记忆操作不再是孤立的个人记忆，
      # 而是读写同一份 TEAM_MEMORY.md（位于 team_memory_dir 下）。
      # 这允许成员之间通过记忆文件共享上下文（如项目背景、决策记录等）。
      # ============================================================
      memory:
        # ---------- 总开关 ----------
        # 关闭时 TeamMemoryManager 不创建，成员记忆回退到各自独立的 MemoryRail
        enabled: false

        # ---------- 场景标识 ----------
        # "general" — 通用场景，记忆提取 prompt 偏重项目背景与决策
        # "coding"  — 编码场景，记忆提取 prompt 偏重技术方案与架构决策
        scenario: "general"

        # ---------- 自动提取 ----------
        # true  — 每轮对话结束后，后台自动总结并写入 TEAM_MEMORY.md
        # false — 仅当 LLM 主动调用记忆工具时才写入
        # 仅在 lifecycle=persistent 时生效；temporary 团队不触发自动提取
        auto_extract: true

        # ---------- 共享记忆 ----------
        # true  — 所有成员共享同一份 TEAM_MEMORY.md（默认）
        # false — 每个成员维护独立记忆文件（按 member_name 分目录）
        shared_memory: true

        # ---------- 记忆注入模式 ----------
        # 控制记忆内容如何注入到每个成员的 system prompt 中：
        #   "proactive" — 每轮对话开始时主动注入最新记忆摘要
        member_memory_prompt_mode: "proactive"
